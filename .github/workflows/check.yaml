name: check

on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm install

      - name: Node Build 
        run: npm run build

      - name: Node lint
        run: npm run lint

